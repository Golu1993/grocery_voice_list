name: grocery_voice_list
description: "Voice-powered grocery list with English & Hindi support"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Voice
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.0

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2

  # State management
  provider: ^6.1.2

  # UI
  flutter_slidable: ^3.1.0
  google_fonts: ^6.2.1

  # Utilities
  uuid: ^4.3.3
  intl: ^0.19.0
  collection: ^1.18.0
  permission_handler: ^11.3.0
  get: ^4.7.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
