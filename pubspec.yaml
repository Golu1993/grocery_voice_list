name: vocart
description: "Voice-powered list with English & Hindi support"
publish_to: 'none'

version: 1.0.6+6

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Voice
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.0

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2

  # State management
  provider: ^6.1.2

  # UI
  flutter_slidable: ^4.0.3
  google_fonts: ^8.2.1

  # Utilities
  uuid: ^4.3.3
  intl: ^0.20.3
  collection: ^1.18.0
  permission_handler: ^13.0.1
  get: ^4.7.3
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  pdf: ^3.13.0
  printing: ^5.15.0
  package_info_plus: ^10.2.1
  in_app_review: ^2.0.12
  google_sign_in: ^7.2.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  device_info_plus: ^13.2.0
  android_id: ^0.6.0
  cloud_firestore: ^6.10.0
  firebase_messaging: ^16.7.0
  connectivity_plus: ^7.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - images/
    - assets/fonts/
